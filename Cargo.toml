[package]
name = "fontcraft"
version = "1.3.0"
description = "FontCraft: a fast native font browser and previewer"
edition = "2024"
license = "MIT"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.18.0"
self-replace = "1.5.1"
sha2 = "0.11.1"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "variable-fonts"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["x11", "wayland"] }

[profile.release]
opt-level = 3

# Unoptimized text shaping and rasterizing froze the window for over a second while fonts loaded,
# so even debug builds (what `cargo build` makes) optimize the libraries; our own code stays debuggable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.epaint]
opt-level = 3

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Shell"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Arabic/Hebrew layout and cursor: egui pull request emilk/egui#8577 (bidi runs), applied to epaint 0.37.0.
# Drop this once that change ships in an egui release.
[patch.crates-io]
epaint = { path = "vendor/epaint" }
