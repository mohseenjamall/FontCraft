name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: windows-x64.exe, bin: fontcraft.exe }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, asset: linux-x64, bin: fontcraft }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          cargo_v=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1 | tr -d '\r')
          if [ "${GITHUB_REF_NAME}" != "v${cargo_v}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${cargo_v}" >&2
            exit 1
          fi
          echo "VERSION=${cargo_v}" >> "$GITHUB_ENV"
      - name: Check the release notes exist
        shell: bash
        run: node scripts/check-whats-new.mjs
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libgtk-3-dev
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Name the binary
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/FontCraft-${VERSION}-${{ matrix.asset }}"
      - name: Zip the Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/FontCraft-$env:VERSION-windows-x64.exe" -DestinationPath "dist/FontCraft-$env:VERSION-windows-x64.zip"
      - name: Build the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) {
              choco install innosetup -y --no-progress
            }
          }
          & $iscc /DAppVersion=$env:VERSION /DSourceExe="$PWD\target\x86_64-pc-windows-msvc\release\fontcraft.exe" /O"$PWD\dist" packaging\windows\FontCraft.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "dist\FontCraft-$env:VERSION-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) { Write-Error "Installer not found: $setup"; exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FontCraft-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  # FontCraft-<version>-macos.dmg (universal; signed and notarized when the secrets are set).
  macos:
    uses: ./.github/workflows/macos-build.yml
    with:
      artifact: FontCraft-macos-dmg
    secrets: inherit

  release:
    needs: [build, macos]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Lines are "<hex>  <file>" (two spaces), which update::expected_hash parses.
          sha256sum FontCraft-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$TAG" FontCraft-* SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
