name: macOS test build

on:
  workflow_dispatch:
  push:
    branches: [mac-linux-support]

jobs:
  dmg:
    uses: ./.github/workflows/macos-build.yml
    with:
      artifact: FontCraft-macos-dmg
      retention-days: 7
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      # A pre-release never counts as "latest", so the in-app updater and the website are unaffected.
      - name: Publish mac-beta pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mac-beta --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create mac-beta dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "macOS beta (test build)" \
            --notes "Test build for macOS. Install: curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/mac-linux-support/install-mac.sh | sh"
